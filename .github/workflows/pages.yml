# Build the web version and publish it on GitHub Pages (Settings → Pages → Source: GitHub Actions).
# Uses only what is committed: src/data/*.json (card data) and public/art/ (card images).
# It never runs the Python pipeline and never downloads anything from the card sites.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # configure-pages only reads the Pages site settings (GET /repos/{owner}/{repo}/pages): pages: read is enough
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # base_path is "/GWENT-Thai-wiki" on <user>.github.io and "" with a custom domain -> BASE "/GWENT-Thai-wiki/" or "/"
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm run build:web
        env:
          BASE: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
